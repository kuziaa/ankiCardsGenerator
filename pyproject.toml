[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-cards-generator"
version = "0.1.0"
description = "Generate Anki decks with flashcards for English vocabulary learning."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "genanki==0.13.1",
    "gTTS>=2.3.2,<3",
    "Pillow>=10.1,<13",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]

[project.scripts]
anki-cards-generator = "anki_generator:cli"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["anki_generator"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["models*", "utils*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
