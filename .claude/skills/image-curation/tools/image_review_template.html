<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image review - $SOURCE</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0;
         background: #f4f4f6; color: #1c1c1e; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
           gap: 16px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #e2e2e8; }
  header h1 { font-size: 18px; margin: 0; }
  .counts { color: #6b6b72; font-size: 14px; }
  .spacer { flex: 1; }
  #status { font-size: 14px; color: #2f9e44; }
  button { font-size: 15px; padding: 8px 18px; border: 0; border-radius: 8px;
           background: #2f9e44; color: #fff; cursor: pointer; }
  button:hover { background: #268a3a; }
  main { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  section.word { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 20px;
                 background: #fff; border: 1px solid #e2e2e8; border-radius: 12px; padding: 16px; }
  section.word h2 { margin: 0 0 4px; font-size: 20px; }
  .ru { margin: 0 0 8px; color: #2a7ae2; font-weight: 600; }
  .ex { margin: 0 0 8px; font-style: italic; color: #444; line-height: 1.45; }
  .why { margin: 0; line-height: 1.45; }
  .candidates { display: flex; gap: 12px; align-items: flex-start; }
  .strip { display: flex; flex: 1; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .specials { display: flex; flex: 0 0 auto; flex-direction: column; gap: 8px; }
  .cand { flex: 0 0 auto; cursor: pointer; padding: 4px; border: 3px solid transparent;
          border-radius: 10px; }
  .cand img { display: block; width: 190px; height: 140px; object-fit: contain;
              background: #fafafa; border-radius: 6px; }
  .cand .tag { display: block; max-width: 190px; margin-top: 4px; font-size: 11px; color: #77777e; }
  .empty { margin: 0; align-self: center; padding: 22px 16px; border: 1px dashed #d0d0d6;
           border-radius: 10px; color: #77777e; font-size: 14px; line-height: 1.4; }
  .special { display: flex; align-items: center; gap: 6px; white-space: nowrap;
             padding: 12px 14px; border: 1px dashed #b9b9c0; border-radius: 10px;
             font-size: 14px; cursor: pointer; }
  .selected { border-color: #2f9e44; background: #f2fbf4; }
  dialog { max-width: 640px; border: 0; border-radius: 12px; padding: 20px; }
  dialog p { margin: 0 0 12px; line-height: 1.45; }
  dialog textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, Consolas, monospace;
                    font-size: 12px; }
  dialog .actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  dialog a { font-size: 14px; }
  @media (max-width: 900px) { section.word { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Image review - $SOURCE</h1>
  <span class="counts">$COUNTERS</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="save">Save choices</button>
</header>
<main>
$ROWS
</main>
<dialog id="fallback">
  <p>The browser would not let the page write the file directly. Copy the text
     below and hand it over, or try the download link.</p>
  <textarea id="payload" rows="14" readonly></textarea>
  <div class="actions">
    <button id="copy">Copy to clipboard</button>
    <a id="download" download="choices.json">Download choices.json</a>
    <span class="spacer"></span>
    <button id="close">Close</button>
  </div>
</dialog>
<script>
const SOURCE = $SOURCE_JSON;

function paint() {
  document.querySelectorAll('.cand, .special').forEach(label => {
    label.classList.toggle('selected', label.querySelector('input').checked);
  });
}

function collect() {
  const choices = {};
  document.querySelectorAll('section.word').forEach(section => {
    const checked = section.querySelector('input[type=radio]:checked');
    const value = checked ? checked.value : '__none__';
    if (value === '__none__') {
      choices[section.dataset.word] = { action: 'none', pick: null };
    } else if (value === '__more__') {
      choices[section.dataset.word] = { action: 'more', pick: null };
    } else {
      choices[section.dataset.word] = { action: 'keep', pick: value };
    }
  });
  return { source: SOURCE, choices: choices };
}

function showFallback(text) {
  const payload = document.getElementById('payload');
  payload.value = text;
  document.getElementById('download').href =
    URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  document.getElementById('fallback').showModal();
  payload.focus();
  payload.select();
}

async function save() {
  const text = JSON.stringify(collect(), null, 2);
  const status = document.getElementById('status');
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: 'choices.json' });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      status.textContent = 'Saved';
      return;
    } catch (error) {
      if (error.name === 'AbortError') { return; }
    }
  }
  // Local pages cannot always write or download; the text itself always works
  status.textContent = 'Direct write unavailable';
  showFallback(text);
}

function copyPayload() {
  const payload = document.getElementById('payload');
  payload.select();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(payload.value).catch(() => document.execCommand('copy'));
  } else {
    document.execCommand('copy');
  }
  document.getElementById('status').textContent = 'Copied';
}

document.addEventListener('change', paint);
document.getElementById('save').addEventListener('click', save);
document.getElementById('copy').addEventListener('click', copyPayload);
document.getElementById('close').addEventListener('click', () => {
  document.getElementById('fallback').close();
});
paint();
</script>
</body>
</html>
